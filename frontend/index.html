<!doctype html>
<html lang="en" data-theme="iris-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris — log correlation workbench</title>
    <script>
      try {
        var t = localStorage.getItem('iris.theme'); if (t) document.documentElement.setAttribute('data-theme', t);
        var d = localStorage.getItem('iris.density'); if (d) document.documentElement.setAttribute('data-density', d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
